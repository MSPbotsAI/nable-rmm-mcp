services:
  nable-rmm-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: nable-rmm-mcp:latest
    container_name: nable-rmm-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - NABLE_BASE_URL=https://www.am.remote.management
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
